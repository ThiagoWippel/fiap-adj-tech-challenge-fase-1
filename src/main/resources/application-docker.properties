# ==========================================================
# Perfil docker - MySQL em contêiner
# Uso: docker compose up
# ==========================================================

# ----------------------------------------------------------
# Conexao com o MySQL
# ----------------------------------------------------------
# O host e o NOME DO SERVICO declarado no docker-compose.yml,
# nao "localhost". Dentro da rede do Compose, cada contêiner tem
# seu proprio localhost; usar localhost aqui faria a aplicacao
# tentar conectar nela mesma.
#
# Os valores apos ":" sao apenas padroes de seguranca. Em execucao,
# as variaveis vem do arquivo .env atraves do compose.
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:restaurante_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------
# validate: o Hibernate NAO cria nem altera tabelas. Ele apenas
# confere se o esquema existente corresponde as entidades. O
# esquema e criado pelo script SQL montado no contêiner do MySQL.
# Essa separacao garante que a estrutura do banco seja um artefato
# explicito e versionado, e nao um efeito colateral do mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ----------------------------------------------------------
# Pool de conexoes
# ----------------------------------------------------------
# Tempo de espera por uma conexao livre antes de falhar.
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

logging.level.br.com.fiap.restaurante=INFO