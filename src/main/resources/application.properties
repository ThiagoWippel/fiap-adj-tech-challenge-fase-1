# ==========================================================
# Configuracao base - vale para todos os ambientes
# ==========================================================

spring.application.name=restaurante

# Perfil ativo por padrao. No container, e sobrescrito pela
# variavel de ambiente SPRING_PROFILES_ACTIVE definida no compose.
spring.profiles.active=dev

# ----------------------------------------------------------
# Tratamento de erros - RFC 7807 (ProblemDetail)
# ----------------------------------------------------------
# Faz com que as excecoes lancadas pelo proprio framework
# (JSON malformado, metodo nao suportado, parametro ausente)
# tambem sejam respondidas no formato ProblemDetail, e nao
# apenas as excecoes de negocio tratadas no nosso handler.
spring.mvc.problemdetails.enabled=true

# ----------------------------------------------------------
# Documentacao OpenAPI / Swagger
# ----------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Ordena as operacoes por metodo HTTP em vez da ordem de declaracao,
# deixando a interface previsivel para quem for avaliar.
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ----------------------------------------------------------
# Fuso horario
# ----------------------------------------------------------
# Fixa o fuso na serializacao JSON. O contêiner MySQL opera em UTC
# por padrao; sem isso, a data gravada diverge da exibida na API.
spring.jackson.time-zone=America/Sao_Paulo

# ----------------------------------------------------------
# Log
# ----------------------------------------------------------
logging.level.br.com.fiap.restaurante=INFO

# ----------------------------------------------------------
# JPA
# ----------------------------------------------------------
# Fecha a sessao do banco ao fim da camada de servico, em vez de
# mante-la aberta ate a resposta HTTP terminar. Como usamos DTOs
# e resolvemos tudo no servico, nao ha carregamento tardio na
# serializacao - e assim consultas nao acontecem fora do lugar.
spring.jpa.open-in-view=false