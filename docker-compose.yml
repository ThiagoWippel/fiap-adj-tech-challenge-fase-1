# A chave "version" foi removida da especificacao do Compose e
# hoje gera aviso de obsolescencia. Por isso o arquivo comeca
# direto em "services".

services:

  mysql:
    image: mysql:8.4
    container_name: restaurante-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      # Porta externa diferente da interna para nao conflitar com
      # uma eventual instalacao local de MySQL na maquina.
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      # Volume nomeado: os dados sobrevivem ao ciclo de vida do
      # contêiner. Sem ele, o banco volta vazio a cada "down".
      - mysql-data:/var/lib/mysql
      # Scripts nesta pasta sao executados pelo MySQL apenas na
      # PRIMEIRA inicializacao, com o volume ainda vazio.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # O ponto mais importante deste arquivo. "depends_on" sozinho
      # garante apenas que o contêiner do banco COMECOU a subir, nao
      # que o MySQL ja aceita conexoes. Sem esta verificacao, a
      # aplicacao sobe antes, falha ao conectar e morre - um erro
      # intermitente que so aparece na primeira execucao.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - restaurante-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurante-app
    restart: unless-stopped
    environment:
      # Sobrescreve o perfil declarado em application.properties.
      SPRING_PROFILES_ACTIVE: docker
      # DB_HOST e o NOME DO SERVICO acima, nao "localhost".
      # Dentro da rede do Compose, cada contêiner tem seu proprio
      # localhost; o Docker resolve o nome do servico para o IP certo.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        # Aguarda o healthcheck passar, nao apenas o contêiner existir.
        condition: service_healthy
    networks:
      - restaurante-net

volumes:
  mysql-data:
    name: restaurante-mysql-data

networks:
  restaurante-net:
    driver: bridge